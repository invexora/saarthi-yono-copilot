name: Saarthi source validation

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: saarthi-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Backend and frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_CACHE_DIR: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_ADDOPTS: -p no:cacheprovider

    steps:
      - name: Check out source without retaining credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Reject high-confidence secret material
        shell: bash
        run: |
          set -euo pipefail
          pattern='-----BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----|(^|[^A-Z0-9])(AKIA|ASIA)[A-Z0-9]{16}([^A-Z0-9]|$)|gh[pousr]_[A-Za-z0-9]{30,}|sk-(proj-)?[A-Za-z0-9_-]{20,}|AIza[0-9A-Za-z_-]{30,}|xox[baprs]-[A-Za-z0-9-]{10,}|(sk|rk)_live_[A-Za-z0-9]{16,}'
          set +e
          secret_files="$(git grep -Il -E -e "$pattern" -- .)"
          grep_status=$?
          set -e
          if [ "$grep_status" -gt 1 ]; then
            echo "::error::Secret scan could not inspect the repository."
            exit "$grep_status"
          fi
          if [ -n "$secret_files" ]; then
            echo "::error::Potential secret material detected in the following files:"
            printf '%s\n' "$secret_files"
            exit 1
          fi

      - name: Check changed lines for whitespace errors
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          zero_sha=0000000000000000000000000000000000000000
          base_sha=""

          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "$PR_BASE_SHA" ]; then
            base_sha="$PR_BASE_SHA"
          elif [ -n "$PUSH_BEFORE_SHA" ] && [ "$PUSH_BEFORE_SHA" != "$zero_sha" ]; then
            base_sha="$PUSH_BEFORE_SHA"
          elif [ -n "$DEFAULT_BRANCH" ] && git show-ref --verify --quiet "refs/remotes/origin/$DEFAULT_BRANCH"; then
            base_sha="$(git merge-base "origin/$DEFAULT_BRANCH" HEAD)"
          elif git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            base_sha="$(git rev-parse HEAD^)"
          else
            base_sha="$(git hash-object -t tree /dev/null)"
          fi

          git diff --check "$base_sha" HEAD --
          git diff --check

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install backend and test dependencies
        run: python -m pip install --no-cache-dir -r backend/requirements-dev.txt

      - name: Run the full Python test suite
        run: python -m pytest -q

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Check frontend JavaScript syntax
        run: node --check app.js

      - name: Run frontend contract tests
        run: node --test tests/frontend/*.test.mjs
