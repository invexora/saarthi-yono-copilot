<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981"/>
    </marker>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, sans-serif; font-size: 24px; font-weight: 800; fill: #f8fafc; }
    .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #94a3b8; }
    .section-title { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #38bdf8; }
    .card-title { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 700; fill: #f1f5f9; }
    .card-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #94a3b8; }
    .card-code { font-family: "SF Mono", Consolas, monospace; font-size: 10px; fill: #a5f3fc; }
  </style>

  <rect width="1200" height="680" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5"/>

  <text x="50" y="48" class="title">Small Language Model (SLM) Architecture &amp; Signal Detection</text>
  <text x="50" y="70" class="subtitle">Edge-Optimized 3B Parameter Fine-Tuned Model for Real-Time Financial Signal Categorization</text>

  <!-- Pillar 1 -->
  <rect x="50" y="100" width="330" height="540" rx="12" fill="url(#cardGrad1)" stroke="#3b82f6" stroke-width="1.5" stroke-opacity="0.6"/>
  <rect x="50" y="100" width="330" height="40" rx="12" fill="#1e3a8a" fill-opacity="0.4"/>
  <text x="70" y="126" class="section-title">1. Synthetic Data &amp; Privacy Scrubbing</text>

  <rect x="70" y="160" width="290" height="95" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="85" y="184" class="card-title">Synthetic Training Generator</text>
  <text x="85" y="202" class="card-text">• 10,000+ Multi-Persona Financial Scenarios</text>
  <text x="85" y="218" class="card-text">• Segments: Corporate, Pensioner, SME, Stress</text>
  <text x="85" y="234" class="card-code">generate_synthetic_dataset.py</text>

  <rect x="70" y="275" width="290" height="105" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="85" y="299" class="card-title">DPDP Privacy Scrubbing Pipeline</text>
  <text x="85" y="317" class="card-text">• Regex Masking: PAN, Aadhaar, Account No.</text>
  <text x="85" y="333" class="card-text">• Noise Infusion &amp; Data Minimization</text>
  <text x="85" y="350" class="card-code">backend/ml/data_schema.py</text>

  <rect x="70" y="400" width="290" height="105" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="85" y="424" class="card-title">Teacher-Student Distillation</text>
  <text x="85" y="442" class="card-text">• Teacher: Llama-3-70B / Gemini Pro reasoning</text>
  <text x="85" y="458" class="card-text">• Student: Llama-3.2-3B / Phi-3.5-mini Base</text>
  <text x="85" y="475" class="card-code">signal-lm-training-kit/scripts/</text>

  <!-- Pillar 2 -->
  <rect x="420" y="100" width="360" height="540" rx="12" fill="url(#cardGrad1)" stroke="#8b5cf6" stroke-width="1.5" stroke-opacity="0.6"/>
  <rect x="420" y="100" width="360" height="40" rx="12" fill="#581c87" fill-opacity="0.4"/>
  <text x="440" y="126" class="section-title">2. QLoRA Fine-Tuning &amp; Quantization</text>

  <rect x="440" y="160" width="320" height="130" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="455" y="184" class="card-title">4-Bit QLoRA Fine-Tuning Loop</text>
  <text x="455" y="202" class="card-text">• LoRA Rank: r=16, Alpha: 32, Dropout: 0.05</text>
  <text x="455" y="218" class="card-text">• Target Modules: q_proj, k_proj, v_proj, o_proj</text>
  <text x="455" y="234" class="card-text">• Learning Rate: 2e-4 with Cosine Decay</text>
  <text x="455" y="254" class="card-code">backend/ml/finetune_config.yaml</text>

  <rect x="440" y="310" width="320" height="110" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="455" y="334" class="card-title">Quantization &amp; Export</text>
  <text x="455" y="352" class="card-text">• GGUF Q4_K_M (1.8 GB RAM footprint)</text>
  <text x="455" y="368" class="card-text">• ONNX Runtime with TensorRT Acceleration</text>
  <text x="455" y="388" class="card-code">signal-lm-training-kit/configs/</text>

  <rect x="440" y="440" width="320" height="100" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="455" y="464" class="card-title">Rigorous Offline Evaluation</text>
  <text x="455" y="482" class="card-text">• Accuracy: &gt; 97.4% on 4 Core Signal Classes</text>
  <text x="455" y="498" class="card-text">• Hallucination Rate: &lt; 0.01% on Banking Scope</text>
  <text x="455" y="516" class="card-code">backend/ml/evaluate.py</text>

  <!-- Pillar 3 -->
  <rect x="820" y="100" width="330" height="540" rx="12" fill="url(#cardGrad1)" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.6"/>
  <rect x="820" y="100" width="330" height="40" rx="12" fill="#064e3b" fill-opacity="0.4"/>
  <text x="840" y="126" class="section-title">3. Calibrated Edge Inference</text>

  <rect x="840" y="160" width="290" height="95" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="855" y="184" class="card-title">Sub-10ms Inference Engine</text>
  <text x="855" y="202" class="card-text">• Latency: 4.8ms average per event</text>
  <text x="855" y="218" class="card-text">• Structured JSON Output Constraints</text>
  <text x="855" y="234" class="card-code">backend/signal_detection.py</text>

  <rect x="840" y="275" width="290" height="120" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.2"/>
  <text x="855" y="299" class="card-title">Confidence Gate (tau = 0.85)</text>
  <text x="855" y="317" class="card-text">• If Confidence &gt;= 0.85 -&gt; Fast Track Approval</text>
  <text x="855" y="333" class="card-text">• If Confidence &lt; 0.85 -&gt; Deterministic Rule</text>
  <text x="855" y="349" class="card-text">• Low Risk Friction: Low / High Risk: High</text>
  <text x="855" y="369" class="card-code">minimum_signal_confidence: 0.85</text>

  <rect x="840" y="415" width="290" height="145" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="855" y="439" class="card-title">Classified Behavioral Intents</text>
  <text x="855" y="457" class="card-text">1. BRANCH_FRICTION (CDM / UPI LITE)</text>
  <text x="855" y="473" class="card-text">2. DEBT_OPPORTUNITY (Express Credit)</text>
  <text x="855" y="489" class="card-text">3. SURPLUS_SAVINGS (Green FD)</text>
  <text x="855" y="505" class="card-text">4. FINANCIAL_STRESS (Compassionate RM)</text>

  <path d="M 380 200 L 440 200" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 380 330 L 440 330" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 780 200 L 840 200" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 780 335 L 840 335" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 985 395 L 985 415" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-green)"/>
</svg>